<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Portal con los proyectos individuales del equipo de desarrollo web.">
<title>Portal de Proyectos · Equipo de Desarrollo Web</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1120;
    --surface: #131c31;
    --surface-2: #1a2540;
    --line: #26324f;
    --text: #e8edf7;
    --muted: #9aa8c4;
    --brand: #5b9bff;
    --focus: #8bb8ff;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface-2: #eef2fa;
    --line: #d8dfee;
    --text: #141b2d;
    --muted: #55627f;
    --brand: #2563eb;
    --focus: #2563eb;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Encabezado */
  header { border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 10; }
  .bar { max-width: 1120px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .logo { width: 38px; height: 38px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; color: #fff; }
  .brand h1 { font-size: 1.05rem; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .brand p { margin: 0; font-size: .78rem; color: var(--muted); }
  .icon-btn {
    width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer;
    background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
  }
  .icon-btn:hover { background: var(--surface-2); }

  /* Contenido */
  main { flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding: 48px 20px 64px; }
  .intro { max-width: 620px; margin-bottom: 32px; }
  .intro h2 { font-size: clamp(1.9rem, 4.5vw, 2.8rem); line-height: 1.1; letter-spacing: -.03em; font-weight: 800; margin: 0 0 12px; }
  .intro p { margin: 0; color: var(--muted); max-width: 56ch; }

  /* Herramientas: búsqueda + filtros */
  .tools { display: flex; flex-direction: column; gap: 14px; margin-bottom: 28px; }
  .search { position: relative; max-width: 440px; }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; padding: 11px 40px 11px 40px; font: inherit; font-size: .92rem;
    background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: 2px solid var(--focus); outline-offset: 1px; border-color: transparent; }
  .search kbd {
    position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    font: inherit; font-size: .72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px;
  }
  .search input:not(:placeholder-shown) ~ kbd { display: none; }
  .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 8px; display: none; place-items: center; }
  .search input:not(:placeholder-shown) ~ .clear { display: grid; }
  .clear:hover { color: var(--text); background: var(--surface-2); }

  /* Tarjetas */
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); list-style: none; padding: 0; margin: 0; }
  .card {
    --accent: var(--brand);
    position: relative; display: flex; flex-direction: column; height: 100%;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px;
    border-top: 3px solid var(--accent);
    color: inherit; text-decoration: none; cursor: pointer;
    transition: border-color .2s, transform .2s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .avatar {
    width: 60px; height: 60px; border-radius: 14px; flex: none; overflow: hidden;
    background: var(--surface-2); display: grid; place-items: center;
    font-weight: 700; font-size: 1.6rem; color: var(--accent);
  }
  .card h3 { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: -.01em; }
  .go {
    margin-top: auto; display: flex; align-items: center; justify-content: space-between;
    padding-top: 14px; border-top: 1px solid var(--line); font-weight: 600; font-size: .9rem;
  }
  .go svg { transition: transform .2s; color: var(--accent); }
  .card:hover .go svg { transform: translateX(4px); }

  .empty { display: none; text-align: center; padding: 56px 16px; border: 1px dashed var(--line); border-radius: 16px; }
  .empty.show { display: block; }
  .empty h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .empty p { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
  .empty button { font: inherit; font-weight: 600; font-size: .88rem; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; }
  .empty button:hover { background: var(--surface-2); }

  footer { border-top: 1px solid var(--line); padding: 22px 20px; text-align: center; font-size: .8rem; color: var(--muted); }

  /* Una sola animación de entrada, respetando preferencias del sistema */
  @media (prefers-reduced-motion: no-preference) {
    .grid.first-load .card { animation: in .5s both; animation-delay: calc(var(--i) * 70ms); }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } html { scroll-behavior: auto; } }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </div>
      <div>
        <h1>Portal de Proyectos</h1>
        <p>Equipo de Desarrollo Web</p>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Cambiar entre tema claro y oscuro">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="intro">
    <h2>Portafolio del equipo</h2>
    <p>Elige a un colaborador para abrir su proyecto.</p>
  </section>

  <div class="tools">
    <div class="search" role="search">
      <label for="searchInput" class="sr-only">Buscar colaborador</label>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="searchInput" placeholder="Buscar colaborador" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
      <button type="button" class="clear" id="clearBtn" aria-label="Borrar búsqueda">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  <ul class="grid first-load" id="grid"></ul>

  <div class="empty" id="empty">
    <h3>Nadie coincide con tu búsqueda</h3>
    <p>Prueba con otro nombre.</p>
    <button type="button" id="resetBtn">Borrar búsqueda</button>
  </div>
</main>

<footer>
  <p>© <span id="year">2026</span> Equipo de Desarrollo Web · Proyecto final con Git y GitHub</p>
</footer>

<script>
  const colaboradores = [
    { nombre: "Karen",   ruta: "Karen/index.html",   color: "#5b9bff" },
    { nombre: "Lizeth",  ruta: "Lizeth/index.html",  color: "#c084fc" },
    { nombre: "Zabdiel", ruta: "Zabdiel/index.html", color: "#34d399" },
    { nombre: "Juan",    ruta: "Juan/indexjuan.html",    color: "#fbbf24" },
    { nombre: "Amir",    ruta: "Amir/indexamir.html",    color: "#22d3ee" }
  ];

  const $ = id => document.getElementById(id);
  const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

  const state = { query: "" };
  const grid = $("grid"), input = $("searchInput");

  /* ---------- Render ---------- */
  function avatarHTML(c) {
    return `<div class="avatar" aria-hidden="true">${esc(c.nombre.charAt(0).toUpperCase())}</div>`;
  }

  function render() {
    const q = norm(state.query);
    const lista = colaboradores.filter(c => {
      return !q || norm(c.nombre).includes(q);
    });

    grid.innerHTML = lista.map((c, i) => `
      <li>
        <a class="card" href="${esc(c.ruta)}" style="--accent:${esc(c.color)};--i:${i}">
          <div class="card-head">
            ${avatarHTML(c)}
            <h3>${esc(c.nombre)}</h3>
          </div>
          <div class="go"><span>Ver proyecto de ${esc(c.nombre)}</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </div>
        </a>
      </li>`).join("");

    const n = lista.length;
    const texto = `${n} de ${colaboradores.length} colaboradores`;
    $("status").textContent = n ? texto : "Sin resultados";
    $("empty").classList.toggle("show", n === 0);
    grid.hidden = n === 0;
  }

  /* ---------- Eventos ---------- */
  input.addEventListener("input", e => {
    state.query = e.target.value;
    grid.classList.remove("first-load"); // la animación de entrada solo ocurre una vez
    render();
  });
  $("clearBtn").addEventListener("click", () => { input.value = ""; state.query = ""; render(); input.focus(); });
  $("resetBtn").addEventListener("click", () => { input.value = ""; state.query = ""; render(); input.focus(); });

  // Atajo: "/" enfoca el buscador, Escape lo limpia
  document.addEventListener("keydown", e => {
    const escribiendo = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (e.key === "/" && !escribiendo) { e.preventDefault(); input.focus(); }
    if (e.key === "Escape" && document.activeElement === input) $("clearBtn").click();
  });

  /* ---------- Tema claro / oscuro ---------- */
  const root = document.documentElement;
  const temaInicial = safeGet("tema") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  root.dataset.theme = temaInicial;
  $("themeBtn").addEventListener("click", () => {
    const nuevo = root.dataset.theme === "light" ? "dark" : "light";
    root.dataset.theme = nuevo;
    safeSet("tema", nuevo);
  });

  $("year").textContent = new Date().getFullYear();
  render();
</script>
</body>
</html>

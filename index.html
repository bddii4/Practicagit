<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta de presentación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF4E8;
    --card: #FFFFFF;
    --ink: #3A3226;
    --sub: #7A7061;
    --coral: #F2967E;
    --coral-soft: #FDE4DC;
    --sky: #7FB8D9;
    --sky-soft: #E0F0F7;
    --sage: #8CB88A;
    --sage-soft: #E6F1E2;
    --mustard: #E8B84B;
    --mustard-soft: #FBEDCB;
    --lilac: #A79BD1;
    --lilac-soft: #EDE9F8;
    --rule: rgba(58,50,38,0.10);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #221E19; --card: #2C2721; --ink: #F3EEE3; --sub: #C4BAA9;
      --coral-soft: #4A3129; --sky-soft: #23343C; --sage-soft: #263428;
      --mustard-soft: #3B3018; --lilac-soft: #2E293F; --rule: rgba(243,238,227,0.12);
    }
  }
  :root[data-theme="dark"] {
    --paper: #221E19; --card: #2C2721; --ink: #F3EEE3; --sub: #C4BAA9;
    --coral-soft: #4A3129; --sky-soft: #23343C; --sage-soft: #263428;
    --mustard-soft: #3B3018; --lilac-soft: #2E293F; --rule: rgba(243,238,227,0.12);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 44px 22px 60px; position: relative; }

  .doodles { position: absolute; inset: 0; height: 260px; overflow: hidden; pointer-events: none; z-index: 0; }
  .doodles svg { position: absolute; opacity: 0.55; }

  header.top { position: relative; z-index: 1; text-align: center; padding-top: 8px; }
  .avatar {
    width: 92px; height: 92px; margin: 0 auto 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--coral), var(--mustard));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fredoka', sans-serif;
    font-size: 2.1rem; font-weight: 600; color: #fff;
    box-shadow: 0 8px 20px rgba(58,50,38,0.18);
  }
  .name {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(2rem, 6vw, 2.8rem);
    margin: 0 0 8px;
  }
  .role-badge {
    display: inline-block;
    font-weight: 700;
    font-size: 0.85rem;
    color: #5C4B2A;
    background: var(--mustard-soft);
    padding: 7px 16px;
    border-radius: 999px;
  }

  .bio {
    max-width: 480px;
    margin: 26px auto 0;
    text-align: center;
    color: var(--sub);
    font-size: 1rem;
    line-height: 1.6;
    position: relative; z-index: 1;
  }

  h2.section-title {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.25rem;
    text-align: center;
    margin: 48px 0 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 22px;
    border: 1px solid var(--rule);
    box-shadow: 0 6px 18px rgba(58,50,38,0.06);
    opacity: 0;
    transform: translateY(10px);
    animation: pop 0.5s ease forwards;
  }
  .card:nth-child(1) { animation-delay: .05s; }
  .card:nth-child(2) { animation-delay: .15s; }
  .card:nth-child(3) { animation-delay: .25s; }
  .card:nth-child(4) { animation-delay: .35s; }
  @keyframes pop { to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; opacity: 1; transform: none; } }

  .badge {
    width: 52px; height: 52px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
  }
  .badge svg { width: 28px; height: 28px; }
  .card h3 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    margin: 0 0 6px;
  }
  .card p { margin: 0; color: var(--sub); font-size: 0.9rem; line-height: 1.5; }

  .pills { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 4px; }
  .pill {
    font-weight: 700;
    font-size: 0.85rem;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--sky-soft);
    color: #2E5670;
  }
  @media (prefers-color-scheme: dark) { .pill { color: #BFE0F2; } }
  :root[data-theme="dark"] .pill { color: #BFE0F2; }

  footer.contact {
    margin-top: 48px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  }
  footer.contact a {
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--ink);
    text-decoration: none;
    background: var(--coral-soft);
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  footer.contact a:hover, footer.contact a:focus-visible { border-color: var(--coral); }

  .theme-toggle {
    position: absolute; top: 44px; right: 22px; z-index: 2;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .theme-toggle:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }

  .edit-note {
    margin-top: 44px;
    font-size: 0.72rem;
    color: var(--sub);
    text-align: center;
    border-top: 1px dashed var(--rule);
    padding-top: 16px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="doodles">
      <svg width="40" height="40" style="left:6%;top:10px" viewBox="0 0 40 40"><path d="M4 20c4-10 12-14 18-8s2 16-8 16-14-8-10-8z" fill="var(--sage-soft)"/></svg>
      <svg width="30" height="30" style="right:10%;top:0" viewBox="0 0 24 24"><path d="M12 2l2.2 6.8H21l-5.6 4 2.2 6.8L12 15.6 6.4 19.6l2.2-6.8L3 8.8h6.8z" fill="var(--mustard-soft)"/></svg>
      <svg width="26" height="26" style="left:16%;top:120px" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--sky-soft)"/></svg>
      <svg width="34" height="34" style="right:6%;top:150px" viewBox="0 0 24 24"><path d="M12 21s-8-4.6-8-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.4-8 11-8 11z" fill="var(--coral-soft)"/></svg>
      <svg width="20" height="20" style="left:44%;top:0" viewBox="0 0 24 24"><path d="M12 2v6M12 16v6M2 12h6M16 12h6" stroke="var(--lilac)" stroke-width="2" stroke-linecap="round"/></svg>
    </div>

    <button class="theme-toggle" id="themeBtn" type="button" aria-label="Cambiar tema">modo: auto</button>

    <header class="top">
      <div class="avatar" id="avatar"></div>
      <h1 class="name" id="nombre"></h1>
      <span class="role-badge" id="rol"></span>
      <p class="bio" id="bio"></p>
    </header>

    <h2 class="section-title">Lo que me gusta hacer</h2>
    <div class="grid" id="tarjetas"></div>

    <h2 class="section-title">Con lo que trabajo</h2>
    <div class="pills" id="pills"></div>

    <footer class="contact" id="contacto"></footer>

    <p class="edit-note">✏️ Para personalizar esta tarjeta, edita el objeto DATA al inicio de la etiqueta &lt;script&gt; al final del archivo.</p>
  </div>

<script>
  // ─────────────────────────────────────────────
  // ✏️ EDITA AQUÍ TUS DATOS — es lo único que necesitas cambiar
  // ─────────────────────────────────────────────
  const DATA = {
    nombre: "Tu Nombre",
    carrera: "Desarrollo de Software Multiplataforma",
    bio: "Me encanta crear con las manos y con el código: dibujo, pinto, hago manualidades y construyo apps que funcionan en cualquier dispositivo.",
    tarjetas: [
      { titulo: "Dibujo", desc: "Bocetos, retratos y todo lo que se pueda hacer con lápiz y papel.", icon: "pencil", color: "coral" },
      { titulo: "Pintura", desc: "Acuarela, acrílico y explorar colores nuevos.", icon: "brush", color: "sky" },
      { titulo: "Manualidades", desc: "Proyectos DIY, tejido, recortes y mucho pegamento.", icon: "craft", color: "sage" },
      { titulo: "Desarrollo Multiplataforma", desc: "Apps para Android, iOS y web desde una sola base de código.", icon: "devices", color: "lilac" }
    ],
    stack: ["Kotlin Multiplatform", "Flutter", "Android", "iOS", "Web"],
    contacto: {
      "Email": "tu@email.com",
      "GitHub": "github.com/tuusuario",
      "LinkedIn": "linkedin.com/in/tuusuario"
    }
  };
  // ─────────────────────────────────────────────

  const ICONS = {
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="#B4472E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3l7 7-9.5 9.5H4V12.5L14 3z"/><path d="M12.5 4.5l7 7"/></svg>',
    brush: '<svg viewBox="0 0 24 24" fill="none" stroke="#2E5670" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15c-2 0-3.5 1.5-3.5 3.5S4 21 3 21c1.8 0 4-1 4-3.5"/><path d="M9 15l9-9c1-1 2.5-1 3 0 .5 1 0 2-1 3l-9 9-2-3z"/></svg>',
    craft: '<svg viewBox="0 0 24 24" fill="none" stroke="#3E6B3C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="6" r="2.3"/><circle cx="7" cy="18" r="2.3"/><path d="M20 5L9 12l11 7"/></svg>',
    devices: '<svg viewBox="0 0 24 24" fill="none" stroke="#5C4E8C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="13" height="9.5" rx="1.4"/><path d="M6 17.5h5"/><rect x="17" y="8" width="5" height="10" rx="1.2"/></svg>'
  };
  const SOFT = { coral: 'var(--coral-soft)', sky: 'var(--sky-soft)', sage: 'var(--sage-soft)', lilac: 'var(--lilac-soft)' };

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  document.getElementById('nombre').textContent = DATA.nombre;
  document.getElementById('rol').textContent = DATA.carrera;
  document.getElementById('bio').textContent = DATA.bio;
  document.getElementById('avatar').textContent = DATA.nombre.trim().split(/\s+/).slice(0,2).map(function(w){return w[0] || '';}).join('').toUpperCase();

  document.getElementById('tarjetas').innerHTML = DATA.tarjetas.map(function(t){
    return '<div class="card">' +
      '<div class="badge" style="background:' + SOFT[t.color] + '">' + (ICONS[t.icon] || '') + '</div>' +
      '<h3>' + esc(t.titulo) + '</h3><p>' + esc(t.desc) + '</p></div>';
  }).join('');

  document.getElementById('pills').innerHTML = DATA.stack.map(function(s){
    return '<span class="pill">' + esc(s) + '</span>';
  }).join('');

  document.getElementById('contacto').innerHTML = Object.entries(DATA.contacto).map(function(e){
    var href = e[0].toLowerCase() === 'email' ? 'mailto:' + e[1] : 'https://' + e[1];
    return '<a href="' + href + '" target="_blank" rel="noopener">' + esc(e[0]) + '</a>';
  }).join('');

  var themeBtn = document.getElementById('themeBtn');
  var states = ['auto', 'light', 'dark'];
  var state = 0;
  themeBtn.addEventListener('click', function(){
    state = (state + 1) % states.length;
    var mode = states[state];
    if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', mode);
    themeBtn.textContent = 'modo: ' + mode;
  });
</script>
</body>
</html>
